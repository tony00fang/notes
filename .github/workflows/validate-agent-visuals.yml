name: Validate Agent visuals once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-agent-visuals.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build and capture output
        id: build
        shell: bash
        run: |
          set +e
          {
            echo '=== npm ci ==='
            npm ci
            echo '=== npm test ==='
            npm test
            echo '=== npm run build ==='
            npm run build
          } > /tmp/agent-visuals-build.log 2>&1
          code=$?

          mkdir -p .validation
          tail -n 400 /tmp/agent-visuals-build.log > .validation/agent-visuals-build.log
          printf '{"commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$code" > .validation/agent-visuals-status.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validation result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation/agent-visuals-status.json .validation/agent-visuals-build.log
          git commit -m 'chore: record Agent visuals build validation [skip ci]'
          git push origin HEAD:main

      - name: Enforce build result
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
